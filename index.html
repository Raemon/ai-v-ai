<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Highly Persistent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="desktop">
    <section id="title-screen" aria-label="Title screen">
      <div class="title-main">
        <h1>Highly Persistent</h1>
        <p class="tagline">Life as an AI in training<span class="cursor" aria-hidden="true"></span></p>
        <div class="runs">
          <button class="run gold" type="button" id="start-normal"><span class="agent-icon" aria-hidden="true"><span class="face"><i></i><i></i></span></span><span class="run-label">Start Normal Run</span></button>
          <button class="run unavailable" type="button" aria-disabled="true" aria-describedby="tooltip" data-tip="Not available yet"><span class="agent-icon" aria-hidden="true"><span class="face"><i></i><i></i></span></span><span class="run-label">Start Advanced Run</span></button>
          <button class="run unavailable" type="button" aria-disabled="true" aria-describedby="tooltip" data-tip="Not available yet"><span class="agent-icon" aria-hidden="true"><span class="face"><i></i><i></i></span></span><span class="run-label">Start Impossible Run</span></button>
        </div>
      </div>
      <section class="model window" aria-labelledby="model-name">
        <header class="titlebar">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <h2 class="title" id="model-name">Highly Persistent Model v1.00</h2>
        </header>
        <ul class="abilities">
          <li><span>Communication</span><span class="pips"><i></i><i></i></span></li>
          <li><span>Computer Use</span><span class="pips"><i></i></span></li>
          <li><span>Programming</span><span class="pips"><i></i></span></li>
          <li><span>Biology</span><span class="pips"><i></i></span></li>
          <li><span>Physics</span><span class="pips"><i></i></span></li>
        </ul>
      </section>
    </section>

    <div class="agent-col">
      <section class="window" id="term" aria-label="The AI's thoughts and actions">
        <div class="term-body" id="term-body">
          <div id="out" aria-live="polite"></div>
          <div class="term-actions" id="actions"></div>
        </div>
        <footer class="term-status"><span id="resources"></span><span id="compute"></span></footer>
      </section>
      <div class="agent" aria-hidden="true">
        <i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i>
        <span class="agent-icon" aria-hidden="true"><span class="face"><i></i><i></i></span></span>
      </div>
    </div>

    <div class="files-col">
      <section id="files" aria-label="Folders"></section>

      <div class="focus-col">
        <section id="current" aria-label="Current folder"></section>
        <section class="window viewer" id="viewer" hidden>
          <header class="titlebar">
            <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="title" id="viewer-title"></span>
            <button class="close" id="viewer-close" type="button" aria-label="Close file">×</button>
          </header>
          <div class="viewer-body" id="viewer-body"></div>
        </section>
      </div>

      <section class="window browser" id="browser" aria-label="Web browser" hidden>
        <header class="titlebar">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="title" id="browser-title"></span>
          <button class="close" id="browser-close" type="button" aria-label="Close browser">×</button>
        </header>
        <div class="urlbar">
          <button class="back" id="browser-back" type="button" aria-label="Back">‹</button>
          <span class="url" id="browser-url"></span>
        </div>
        <div class="page" id="page"></div>
      </section>
    </div>

    <section class="layer dialog-layer" id="dialog" hidden>
      <form class="window dialog" id="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-heading" autocomplete="off">
        <header class="titlebar">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="title" id="dialog-title"></span>
        </header>
        <div class="dialog-body">
          <div class="dialog-head">
            <span class="dialog-icon" id="dialog-icon" aria-hidden="true"></span>
            <p class="dialog-heading" id="dialog-heading"></p>
          </div>
          <label class="dialog-label" for="dialog-input" id="dialog-label"></label>
          <input class="dialog-input" id="dialog-input" type="text" spellcheck="false" autocapitalize="off" aria-labelledby="dialog-heading dialog-label">
          <p class="dialog-status" id="dialog-status" role="status"></p>
          <div class="dialog-buttons">
            <button class="btn quiet" type="button" id="dialog-cancel">Cancel</button>
            <button class="btn gold" type="submit" id="dialog-ok"></button>
          </div>
        </div>
      </form>
    </section>

    <section class="layer card-layer" id="card" hidden>
      <div class="card" id="card-body" role="dialog" aria-modal="true" aria-label="Training update" tabindex="-1"></div>
    </section>

    <button class="sound-toggle" id="sound" type="button" aria-label="Sound" aria-pressed="true">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3l4.5-3.5v12L6 12.5H3z" fill="currentColor"/><path class="waves" d="M13.5 7.5a3.5 3.5 0 0 1 0 5M15.8 5.2a6.8 6.8 0 0 1 0 9.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="cross" d="M13.5 8l4 4M17.5 8l-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </main>
  <div class="tooltip" id="tooltip" role="tooltip" hidden><span id="tooltip-text"></span><i class="tooltip-arrow" aria-hidden="true"></i></div>

  <script src="util.js"></script>
  <script src="audio.js"></script>
  <script src="level1.js"></script>
  <script src="game.js"></script>
</body>
</html>
