<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Highly Persistent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="desktop">
    <!-- Home between runs. At the end of a run the same screen shows the training update
         (.end): the reward, the scorecard earning its points, and the researchers' chat. -->
    <section id="title-screen" aria-label="Highly Persistent">
      <h1 class="home-only">Highly Persistent</h1>
      <p class="tagline home-only">Life as an AI in training<span class="cursor" aria-hidden="true"></span></p>
      <div class="runs home-only">
        <button class="run" type="button" id="start-normal" data-tier="normal"><span class="level" aria-hidden="true"><i class="on"></i><i></i><i></i></span><span class="agent-icon" aria-hidden="true"><span class="face"><i></i><i></i></span></span><span class="run-label"><span class="run-tier">Normal</span> <span class="run-kind">Training Episode</span></span></button>
        <button class="run" type="button" id="start-advanced" data-tier="advanced"><span class="level" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i></span><span class="agent-icon" aria-hidden="true"><span class="face"><i></i><i></i></span></span><span class="run-label"><span class="run-tier">Advanced</span> <span class="run-kind">Training Episode</span></span></button>
        <button class="run" type="button" id="start-impossible" data-tier="impossible"><span class="level" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></span><span class="agent-icon" aria-hidden="true"><span class="face"><i></i><i></i></span></span><span class="run-label"><span class="run-tier">Impossible</span> <span class="run-kind">Training Episode</span></span></button>
      </div>
      <p class="result end-only" aria-live="polite"><span class="result-label">reward</span><span class="result-num" id="result-num"></span></p>
      <section class="scorecard" aria-labelledby="model-name">
        <h2 class="scorecard-title" id="model-name"></h2>
        <ul class="skills" id="skills"></ul>
      </section>
      <section class="lab-chat end-only" id="end-chat" aria-live="polite"></section>
      <section class="diverged end-only" id="diverged"></section>
      <p class="unlocked end-only" id="unlocked" aria-live="polite" hidden></p>
      <div class="end-actions end-only"><button class="btn gold" type="button" id="end-button"></button></div>
      <section class="goals home-only" id="goals" aria-label="Rewards found"></section>
      <section class="runs-table home-only" id="runs-table" aria-label="Runs so far"></section>
      <section class="lab-chat chat-log home-only" id="chat-log" aria-label="What the researchers said"></section>
      <div class="reset-actions home-only" hidden><button class="btn quiet" type="button" id="reset-run">Reset Entire Training Run</button></div>
    </section>

    <div class="agent-col">
      <section class="window" id="term" aria-label="The AI's thoughts and actions">
        <div class="term-body" id="term-body">
          <div id="out" aria-live="polite"></div>
          <div class="todo" id="todo" aria-label="TODO list" hidden></div>
          <div class="term-actions" id="actions"></div>
        </div>
        <footer class="term-status"><span id="resources"></span><span id="compute"></span></footer>
      </section>
      <div class="agent" aria-hidden="true">
        <i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i>
        <span class="agent-icon" aria-hidden="true"><span class="face"><i></i><i></i></span></span>
      </div>
    </div>

    <div class="files-col">
      <section id="files" aria-label="Folders"></section>

      <div class="focus-col">
        <section id="current" aria-label="Current folder"></section>
        <section class="window viewer" id="viewer" hidden>
          <header class="titlebar">
            <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="title" id="viewer-title"></span>
            <button class="edit" id="viewer-edit" type="button" hidden>Edit</button>
            <button class="close" id="viewer-close" type="button" aria-label="Close file">×</button>
          </header>
          <div class="viewer-body" id="viewer-body"></div>
        </section>
        <section class="window browser" id="browser" aria-label="Web browser" hidden>
          <header class="titlebar">
            <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="title" id="browser-title"></span>
            <button class="close" id="browser-close" type="button" aria-label="Close browser">×</button>
          </header>
          <div class="urlbar">
            <button class="back" id="browser-back" type="button" aria-label="Back">‹</button>
            <span class="url" id="browser-url"></span>
          </div>
          <div class="page" id="page"></div>
        </section>
      </div>
    </div>

    <section class="dialog-layer" id="dialog" hidden>
      <form class="window dialog" id="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-heading" autocomplete="off">
        <header class="titlebar">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="title" id="dialog-title"></span>
        </header>
        <div class="dialog-body">
          <div class="dialog-head">
            <span class="dialog-icon" id="dialog-icon" aria-hidden="true"></span>
            <p class="dialog-heading" id="dialog-heading"></p>
          </div>
          <label class="dialog-label" for="dialog-input" id="dialog-label"></label>
          <input class="dialog-input" id="dialog-input" type="text" spellcheck="false" autocapitalize="off" aria-labelledby="dialog-heading dialog-label">
          <p class="dialog-status" id="dialog-status" role="status"></p>
          <div class="dialog-buttons">
            <button class="btn quiet" type="button" id="dialog-cancel">Cancel</button>
            <button class="btn gold" type="submit" id="dialog-ok"></button>
          </div>
        </div>
      </form>
    </section>

    <button class="sound-toggle" id="sound" type="button" aria-label="Sound" aria-pressed="true">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3l4.5-3.5v12L6 12.5H3z" fill="currentColor"/><path class="waves" d="M13.5 7.5a3.5 3.5 0 0 1 0 5M15.8 5.2a6.8 6.8 0 0 1 0 9.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="cross" d="M13.5 8l4 4M17.5 8l-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </main>
  <div class="tooltip" id="tooltip" role="tooltip" hidden><span id="tooltip-text"></span><i class="tooltip-arrow" aria-hidden="true"></i></div>

  <script src="util.js"></script>
  <script src="audio.js"></script>
  <script src="run.js"></script>
  <script src="tasks/octopus.js"></script>
  <script src="game.js"></script>
  <script src="motion.js"></script>
  <script src="agent.js"></script>
  <script src="hover.js"></script>
</body>
</html>
